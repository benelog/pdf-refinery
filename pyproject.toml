[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pdf-refinery"
version = "0.1.0"
description = "CLI tool that applies OCR to scanned book PDFs to make them searchable"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "benelog" }]
keywords = ["pdf", "ocr", "paddleocr", "searchable", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]
dependencies = [
    "click>=8.0",
    "opencv-python>=4.0",
    "paddleocr>=3.0",
    "PyMuPDF>=1.24",
]

[project.urls]
Homepage = "https://github.com/benelog/pdf-refinery"
Repository = "https://github.com/benelog/pdf-refinery"
Issues = "https://github.com/benelog/pdf-refinery/issues"

[project.scripts]
pdf-refinery = "pdf_refinery.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov"]

[tool.pytest.ini_options]
testpaths = ["tests"]
