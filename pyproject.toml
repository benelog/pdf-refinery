[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pdf-refinery"
version = "0.1.0"
description = "CLI tool that applies OCR to scanned book PDFs to make them searchable"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "benelog" }]
keywords = ["pdf", "ocr", "paddleocr", "searchable", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]
dependencies = [
    "click>=8.0",
    "paddleocr>=3.0",
    "paddlepaddle>=3.1,<3.3",
    "pikepdf>=9.0",
    "pypdfium2>=4.30",
]

# paddlepaddle is named here even though paddleocr already needs it, because
# paddleocr does not say so: paddlex declines to version-check it at all, since
# the CPU and GPU builds are separate distributions. Nothing then holds a floor,
# and both ends of the range below have been seen to break outright.
#
# On 3.0, a PP-OCRv6 model -- what current paddleocr reaches for by default --
# fails to load at all: "Type of attribute: strides is not right". On 3.3, both
# PP-OCRv5 and PP-OCRv6 die mid-inference with "ConvertPirAttribute2RuntimeAttri
# bute not support", out of the oneDNN path paddlex enables by default on CPU.
# Turning oneDNN off does work around the latter, but costs a factor of four to
# seven on exactly the models this tool runs, so the version is held instead.
# 3.1 and 3.2 were both checked to load and run the two models with oneDNN on.
# Raise the ceiling once a release runs them again.
#
# This is the CPU build. The tool has no device option and has never been run
# anywhere else; a GPU user wants paddlepaddle-gpu, which is a different name
# and a different index, so it cannot be expressed as an extra here.

# PyMuPDF used to do all of the above and is deliberately not here any more.
# It is AGPL v3, which the MIT declared above cannot stand next to once this
# is distributed; pikepdf is MPL-2.0 over QPDF and pypdfium2 is Apache-2.0
# over BSD-licensed PDFium. It stays in the dev extra as a second opinion:
# a text layer only the engine that wrote it can read is not a searchable PDF,
# so the tests check the output with an engine that had no hand in making it.
# See library-alternative.md.

# OpenCV is deliberately absent above even though --preprocess binarize uses it.
# paddlex, which paddleocr requires, pins opencv-contrib-python to an exact
# version. That distribution and opencv-python both install the same `cv2`
# module, so naming opencv-python here does not add a guarantee -- it installs a
# second package over the first and leaves whichever landed last. Nothing on the
# default path imports cv2; binarize imports it where it is used, so if a future
# paddlex stops shipping one, that option fails with an ImportError naming the
# fix instead of the whole tool failing to start.

[project.urls]
Homepage = "https://github.com/benelog/pdf-refinery"
Repository = "https://github.com/benelog/pdf-refinery"
Issues = "https://github.com/benelog/pdf-refinery/issues"

[project.scripts]
pdf-refinery = "pdf_refinery.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov", "PyMuPDF>=1.24"]

[tool.pytest.ini_options]
testpaths = ["tests"]
